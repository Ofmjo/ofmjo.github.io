<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Змейка — MSX</title>
<link rel="stylesheet" href="../common.css"/>
<style>:root{--accent:#34d399;--accent-rgb:52,211,153;--glow2:76,141,255;}</style>
</head>
<body>
<script src="../common.js"></script>
<script>
(function () {
  var COLS = 24;
  var ROWS = 14;
  var SPEEDS = { slow: 0.2, normal: 0.15, fast: 0.11 };
  var SPEED_LABEL = { slow: 'Спокойная', normal: 'Средняя', fast: 'Быстрая' };
  var BONUS_TIME = 7;
  var DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

  var G, view;
  var snake, prevSnake, dir, queue, food, bonus, eatenFx;
  var score, eaten, best, newBest, acc, started, dead, deadT, wrap, base, modeKey;
  var L = { x: 0, y: 0, c: 30 };

  function bestKey() { return 'snake.best.' + modeKey; }

  function interval() { return base * Math.max(0.78, 1 - eaten * 0.006); }

  function occupied(x, y) {
    for (var i = 0; i < snake.length; i++) { if (snake[i].x === x && snake[i].y === y) { return true; } }
    return false;
  }

  function freeCell() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (occupied(x, y)) { continue; }
        if (food && food.x === x && food.y === y) { continue; }
        if (bonus && bonus.x === x && bonus.y === y) { continue; }
        free.push({ x: x, y: y });
      }
    }
    return free.length ? MSX.pick(free) : null;
  }

  function updateHud() {
    if (score > best) {
      best = score;
      newBest = true;
      MSX.store.set(bestKey(), best);
    }
    G.hud('score', score);
    G.hud('len', snake.length);
    G.hud('best', best);
  }

  function turn(name) {
    var d = DIRS[name];
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === last.x && d.y === last.y) { started = true; return; }
    if (d.x === -last.x && d.y === -last.y) { return; }
    if (queue.length < 3) { queue.push(d); }
    started = true;
  }

  function step() {
    eatenFx = null;
    if (queue.length) { dir = queue.shift(); }
    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;
    if (wrap) {
      nx = (nx + COLS) % COLS;
      ny = (ny + ROWS) % ROWS;
    } else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      die('Змейка врезалась в стену.');
      return;
    }
    var eatFood = food && food.x === nx && food.y === ny;
    var eatBonus = bonus && bonus.x === nx && bonus.y === ny;
    var grow = eatFood || eatBonus;
    var limit = snake.length - (grow ? 0 : 1);
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { die('Змейка укусила себя.'); return; }
    }

    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    snake.unshift({ x: nx, y: ny });
    if (grow) {
      prevSnake.push(prevSnake[prevSnake.length - 1]);
    } else {
      snake.pop();
    }

    if (eatFood) {
      eaten++;
      score += 10;
      eatenFx = { x: nx, y: ny, color: '#ff5c5c' };
      food = freeCell();
      if (eaten % 5 === 0 && !bonus) {
        var c = freeCell();
        if (c) { bonus = { x: c.x, y: c.y, t: BONUS_TIME }; }
      }
      if (!food) { win(); return; }
    }
    if (eatBonus) {
      var extra = 30 + Math.round(bonus.t * 5);
      score += extra;
      eatenFx = { x: nx, y: ny, color: '#fbbf24' };
      G.toast('+' + extra);
      bonus = null;
    }
    if (grow) { updateHud(); }
  }

  function die(reason) {
    dead = reason;
    deadT = 0.8;
  }

  function win() {
    G.finish({ title: 'Поле заполнено!', stats: [['Счёт', score, newBest], ['Длина', snake.length], ['Рекорд', best]] });
  }

  /* ---------------- отрисовка ---------------- */

  function resize(w, h) {
    L.c = Math.max(8, Math.floor(Math.min(w / COLS, h / ROWS)));
    L.x = Math.round((w - L.c * COLS) / 2);
    L.y = Math.round((h - L.c * ROWS) / 2);
  }

  function center(p) { return { x: L.x + (p.x + 0.5) * L.c, y: L.y + (p.y + 0.5) * L.c }; }

  function drawApple(ctx, p, scale) {
    var c = center(p);
    var r = L.c * 0.36 * scale;
    ctx.save();
    ctx.shadowColor = 'rgba(255,80,80,.8)';
    ctx.shadowBlur = L.c * 0.6;
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath();
    ctx.arc(c.x, c.y + r * 0.08, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.arc(c.x - r * 0.35, c.y - r * 0.25, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.ellipse(c.x + r * 0.3, c.y - r * 0.95, r * 0.35, r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStar(ctx, p, t) {
    var c = center(p);
    var r = L.c * 0.42 * (1 + Math.sin(MSX.now() / 140) * 0.06);
    ctx.save();
    ctx.shadowColor = 'rgba(251,191,36,.9)';
    ctx.shadowBlur = L.c * 0.7;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(251,191,36,.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y, L.c * 0.62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (t / BONUS_TIME));
    ctx.stroke();
  }

  function segColor(i, n) {
    var k = n > 1 ? i / (n - 1) : 0;
    var light = 62 - k * 22;
    return 'hsl(' + Math.round(152 - k * 20) + ',70%,' + Math.round(light) + '%)';
  }

  function draw() {
    var ctx = view.ctx;
    var c = L.c;
    ctx.clearRect(0, 0, view.w, view.h);

    // поле
    ctx.fillStyle = 'rgba(8,14,18,.9)';
    MSX.rrect(ctx, L.x - 4, L.y - 4, COLS * c + 8, ROWS * c + 8, 12);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.025)';
    for (var y = 0; y < ROWS; y++) {
      for (var x = (y % 2); x < COLS; x += 2) { ctx.fillRect(L.x + x * c, L.y + y * c, c, c); }
    }
    ctx.lineWidth = 3;
    if (wrap) {
      ctx.strokeStyle = 'rgba(56,189,248,.45)';
      if (ctx.setLineDash) { ctx.setLineDash([c * 0.4, c * 0.3]); }
    } else {
      ctx.strokeStyle = 'rgba(248,113,113,.7)';
    }
    MSX.rrect(ctx, L.x - 4, L.y - 4, COLS * c + 8, ROWS * c + 8, 12);
    ctx.stroke();
    if (ctx.setLineDash) { ctx.setLineDash([]); }

    ctx.save();
    ctx.beginPath();
    ctx.rect(L.x, L.y, COLS * c, ROWS * c);
    ctx.clip();

    var t = started && !dead ? Math.min(1, acc / interval()) : 1;
    if (food) { drawApple(ctx, food, 1); }
    if (bonus) { drawStar(ctx, bonus, bonus.t); }
    if (eatenFx && t < 0.9) {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = eatenFx.color;
      var e = center(eatenFx);
      ctx.beginPath();
      ctx.arc(e.x, e.y, c * 0.36 * (1 - t * 0.6), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // позиции сегментов с интерполяцией
    var pts = [];
    for (var i = 0; i < snake.length; i++) {
      var cur = snake[i];
      var pr = prevSnake && prevSnake[i] ? prevSnake[i] : cur;
      if (Math.abs(pr.x - cur.x) > 1 || Math.abs(pr.y - cur.y) > 1) { pr = cur; }
      pts.push({ x: L.x + (pr.x + (cur.x - pr.x) * t + 0.5) * c, y: L.y + (pr.y + (cur.y - pr.y) * t + 0.5) * c, cell: cur });
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = c * 0.74;
    for (var s = pts.length - 1; s > 0; s--) {
      var a = pts[s], b = pts[s - 1];
      if (Math.abs(a.cell.x - b.cell.x) > 1 || Math.abs(a.cell.y - b.cell.y) > 1) { continue; }
      ctx.strokeStyle = segColor(s, pts.length);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    if (pts.length === 1) {
      ctx.fillStyle = segColor(0, 1);
      ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, c * 0.37, 0, Math.PI * 2); ctx.fill();
    }

    // голова
    var h = pts[0];
    ctx.save();
    ctx.shadowColor = dead ? 'rgba(248,113,113,.9)' : 'rgba(52,211,153,.8)';
    ctx.shadowBlur = c * 0.7;
    ctx.fillStyle = dead ? '#f87171' : '#6ee7b7';
    ctx.beginPath();
    ctx.arc(h.x, h.y, c * 0.44, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    var ex = -dir.y, ey = dir.x;
    for (var side = -1; side <= 1; side += 2) {
      var px = h.x + dir.x * c * 0.14 + ex * side * c * 0.18;
      var py = h.y + dir.y * c * 0.14 + ey * side * c * 0.18;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px, py, c * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#062016';
      ctx.beginPath(); ctx.arc(px + dir.x * c * 0.04, py + dir.y * c * 0.04, c * 0.055, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (!started) {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(L.x, L.y + ROWS * c * 0.36, COLS * c, c * 2.2);
      ctx.fillStyle = '#fff';
      ctx.font = '600 ' + Math.round(c * 0.8) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Нажмите стрелку, чтобы начать', L.x + COLS * c / 2, L.y + ROWS * c * 0.36 + c * 1.1);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
  }

  /* ---------------- движок ---------------- */

  G = MSX.game({
    id: 'snake',
    title: 'Змейка',
    continuous: true,
    options: [
      { key: 'speed', label: 'Скорость', values: [
        { value: 'slow', label: 'Спокойная' }, { value: 'normal', label: 'Средняя' }, { value: 'fast', label: 'Быстрая' }
      ], def: 'normal' },
      { key: 'walls', label: 'Края поля', values: [
        { value: 'walls', label: 'Стены' }, { value: 'wrap', label: 'Без стен' }
      ], def: 'walls' }
    ],
    hud: [
      { key: 'score', label: 'Счёт' },
      { key: 'len', label: 'Длина' },
      { key: 'best', label: 'Рекорд' }
    ],
    hints: [['◀ ▲ ▼ ▶', 'поворот'], ['OK / BACK', 'пауза']],
    info: function (s) {
      var b = MSX.store.get('snake.best.' + s.speed + '.' + s.walls, 0);
      return 'Рекорд (' + SPEED_LABEL[s.speed].toLowerCase() + ', ' + (s.walls === 'wrap' ? 'без стен' : 'со стенами') + '): ' + b;
    },
    start: function (s) {
      view = G.canvas();
      resize(view.w, view.h);
      base = SPEEDS[s.speed];
      wrap = s.walls === 'wrap';
      modeKey = s.speed + '.' + s.walls;
      best = MSX.store.get(bestKey(), 0);
      newBest = false;
      var cy = Math.floor(ROWS / 2);
      var cx = Math.floor(COLS / 2) - 2;
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }, { x: cx - 3, y: cy }];
      prevSnake = null;
      dir = DIRS.right;
      queue = [];
      food = null;
      bonus = null;
      eatenFx = null;
      food = freeCell();
      score = 0;
      eaten = 0;
      acc = 0;
      started = false;
      dead = null;
      updateHud();
    },
    resize: resize,
    update: function (dt) {
      if (dead) {
        deadT -= dt;
        if (deadT <= 0) {
          G.finish({
            title: 'Игра окончена',
            text: dead,
            stats: [['Счёт', score, newBest], ['Длина', snake.length], ['Рекорд', best]]
          });
        }
        return;
      }
      if (!started) { return; }
      if (bonus) {
        bonus.t -= dt;
        if (bonus.t <= 0) { bonus = null; }
      }
      acc += dt;
      var iv = interval();
      if (acc >= iv) {
        acc -= iv;
        if (acc > iv) { acc = 0; }
        step();
      }
    },
    draw: draw,
    key: function (k) {
      if (DIRS[k]) { if (!dead) { turn(k); } return true; }
      if (k === 'ok') { G.pause(); return true; }
      return k !== 'back';
    }
  });
})();
</script>
</body>
</html>
