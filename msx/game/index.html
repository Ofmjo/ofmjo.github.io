<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Игры — MSX</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070a0f;
    --line:rgba(255,255,255,.08);
    --text:rgba(255,255,255,.94);
    --muted:rgba(255,255,255,.5);
    --accent:#4c8dff;
  }
  *{box-sizing:border-box;}
  html{font-size:clamp(15px,1.05vw,24px);}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 0%,rgba(76,141,255,.16),transparent 70%),
      radial-gradient(50% 45% at 85% 100%,rgba(140,69,247,.12),transparent 70%);
  }
  #app{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:2.2rem 2.6rem;
  }
  .head{text-align:center;}
  .brand{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);}
  .head h1{margin:.3rem 0 0;font-size:3rem;font-weight:650;letter-spacing:-.02em;}
  .head .sub{margin:.5rem 0 0;color:var(--muted);font-size:1rem;}
  .grid-wrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 0;
  }
  .grid{
    --cols:1;
    display:grid;
    grid-template-columns:repeat(var(--cols),1fr);
    gap:1.2rem;
    width:100%;
    max-width:72rem;
  }
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:11rem;
    padding:1.5rem;
    border-radius:1.3rem;
    border:1px solid var(--line);
    background:linear-gradient(160deg,var(--card) 0%,rgba(9,13,19,.94) 78%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .card-head{display:flex;align-items:center;gap:.6rem;}
  .tag{
    padding:.2rem .6rem;
    border-radius:.5rem;
    background:rgba(255,255,255,.12);
    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,.8);
  }
  .num{margin-left:auto;color:rgba(255,255,255,.35);font-size:1.1rem;font-variant-numeric:tabular-nums;}
  .card h2{margin:auto 0 0;font-size:1.9rem;font-weight:650;}
  .card p{margin:.45rem 0 0;font-size:.92rem;color:rgba(255,255,255,.6);}
  .card-hint{
    margin-top:1.2rem;
    font-size:.82rem;
    letter-spacing:.06em;
    color:rgba(255,255,255,.45);
  }
  .card.sel{
    border-color:rgba(76,141,255,.7);
    transform:scale(1.035);
    box-shadow:0 0 0 2px rgba(76,141,255,.35),0 30px 60px -28px rgba(76,141,255,.9);
  }
  .card.sel .card-hint{color:rgba(255,255,255,.85);}
  .grid.dense .card{min-height:8rem;padding:1.1rem 1.2rem;border-radius:1.1rem;}
  .grid.dense .card h2{font-size:1.45rem;}
  .grid.dense .card p{display:none;}
  .grid.dense .card-hint{margin-top:.7rem;font-size:.78rem;}
  .grid.dense .num{font-size:.95rem;}
  .empty{color:var(--muted);text-align:center;font-size:1rem;}
  .hint-bar{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem 1.6rem;
    justify-content:center;
    color:var(--muted);
    font-size:.85rem;
  }
  .hint-bar span{display:inline-flex;align-items:center;gap:.45rem;}
  .kbd{
    border:1px solid var(--line);
    background:rgba(255,255,255,.05);
    border-radius:.45rem;
    padding:.1rem .5rem;
    color:rgba(255,255,255,.85);
    font-size:.8rem;
  }
</style>
</head>
<body>
<div id="app">
  <header class="head">
    <div class="brand">MSX Games</div>
    <h1>Игры</h1>
    <p class="sub">Выберите игру и нажмите OK</p>
  </header>

  <div class="grid-wrap">
    <main id="grid" class="grid"></main>
  </div>

  <footer class="hint-bar">
    <span><b class="kbd">◀ ▲ ▼ ▶</b> выбор</span>
    <span><b class="kbd">OK</b> играть</span>
    <span><b class="kbd">1–6</b> быстрый запуск</span>
    <span><b class="kbd">BACK</b> выход</span>
  </footer>
</div>

<script src="common.js"></script>
<script>
(function () {
  var GAMES = [
    {
      title: 'Тетрис',
      sub: 'Классика с тенью фигуры, запасом и уровнями',
      tag: 'Аркада',
      color: '#2A1748',
      url: 'tetris/index.html'
    },
    {
      title: 'Судоку',
      sub: 'Цифры прямо с пульта, заметки и подсказки',
      tag: 'Логика',
      color: '#0E2F44',
      url: 'sudoku/index.html'
    },
    {
      title: 'Миллионер',
      sub: '15 вопросов, 50:50, зал и звонок другу',
      tag: 'Викторина',
      color: '#3A2A0C',
      url: 'millionaire/index.html'
    },
    {
      title: '2048',
      sub: 'Складывайте плитки, поле до 6×6',
      tag: 'Головоломка',
      color: '#3A2C12',
      url: '2048/index.html'
    },
    {
      title: 'Змейка',
      sub: 'Три скорости, со стенами или без',
      tag: 'Аркада',
      color: '#123A2A',
      url: 'snake/index.html'
    },
    {
      title: 'Территория',
      sub: 'Большая карта и умные соперники',
      tag: 'Стратегия',
      color: '#1A2140',
      url: 'territory/index.html'
    }
  ];

  var grid = document.getElementById('grid');
  var cards = [];
  var index = 0;
  var cols = 1;

  function update() {
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle('sel', i === index);
    }
  }

  function buildCard(game, i) {
    var card = document.createElement('article');
    card.className = 'card';
    card.style.setProperty('--card', game.color || '#14304A');

    var head = document.createElement('div');
    head.className = 'card-head';

    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = game.tag || 'Игра';

    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = (i < 9 ? '0' : '') + (i + 1);

    head.appendChild(tag);
    head.appendChild(num);

    var title = document.createElement('h2');
    title.textContent = game.title;

    var sub = document.createElement('p');
    sub.textContent = game.sub || '';

    var hint = document.createElement('div');
    hint.className = 'card-hint';
    hint.textContent = 'OK — играть';

    card.appendChild(head);
    card.appendChild(title);
    card.appendChild(sub);
    card.appendChild(hint);
    return card;
  }

  function render() {
    grid.innerHTML = '';
    cards = [];
    if (!GAMES.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Игр пока нет';
      grid.appendChild(empty);
      return;
    }
    cols = Math.min(GAMES.length, 3);
    grid.style.setProperty('--cols', cols);
    grid.classList.toggle('dense', GAMES.length > 4);
    for (var i = 0; i < GAMES.length; i++) {
      var card = buildCard(GAMES[i], i);
      grid.appendChild(card);
      cards.push(card);
    }
    if (index >= GAMES.length) { index = 0; }
    update();
  }

  function move(dx, dy) {
    var n = GAMES.length;
    var next = index;
    if (dx) {
      var x = index + dx;
      if (x >= 0 && x < n) { next = x; }
    }
    if (dy) {
      var y = index + dy * cols;
      if (y >= 0 && y < n) { next = y; }
    }
    if (next !== index) {
      index = next;
      update();
    }
  }

  function open() {
    var game = GAMES[index];
    if (game) { location.href = game.url; }
  }

  function exit() {
    var currentUrl = location.href.split(/[?#]/)[0];
    var launcherUrl = currentUrl.replace(/msx\/game\/index\.html$/, 'msx/launcher.json');
    location.href = 'https://msx.benzac.de/?start=content:' + encodeURI(launcherUrl);
  }

  function onKeyDown(e) {
    var k = MSX.keyOf(e);
    if (!k) { return; }
    e.preventDefault();
    if (e.repeat && (k === 'ok' || k === 'back')) { return; }

    if (k === 'left') { move(-1, 0); }
    else if (k === 'right') { move(1, 0); }
    else if (k === 'up') { move(0, -1); }
    else if (k === 'down') { move(0, 1); }
    else if (k === 'ok') { open(); }
    else if (k === 'back') { exit(); }
    else if (k >= '1' && k <= '9' && +k <= GAMES.length) {
      index = +k - 1;
      update();
      open();
    }
  }

  document.addEventListener('keydown', onKeyDown);
  // стрелки в подсказках — SVG, в шрифтах ТВ этих символов может не быть
  var kbds = document.querySelectorAll('.kbd');
  for (var q = 0; q < kbds.length; q++) { MSX.iconize(kbds[q]); }
  render();
})();
</script>
</body>
</html>
