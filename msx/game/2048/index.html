<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>2048 — MSX</title>
<link rel="stylesheet" href="../common.css"/>
<style>:root{--accent:#fbbf24;--accent-rgb:251,191,36;--glow2:140,69,247;}</style>
</head>
<body>
<script src="../common.js"></script>
<script>
(function () {
  var SLIDE = 0.11;
  var POP = 0.14;
  var TILE = {
    2: ['#2b3648', '#dbe6f5'], 4: ['#36486a', '#e6eefb'], 8: ['#4c8dff', '#041020'], 16: ['#3f6fe0', '#f2f7ff'],
    32: ['#f87171', '#2a0808'], 64: ['#ef4444', '#fff2f2'], 128: ['#fbbf24', '#2a1a00'], 256: ['#f59e0b', '#2a1400'],
    512: ['#34d399', '#04231a'], 1024: ['#22d3ee', '#04222a'], 2048: ['#a855f7', '#1c0730'], 4096: ['#c084fc', '#1c0730'],
    8192: ['#e879f9', '#2a0320']
  };

  var G, view;
  var N = 4;
  var grid, score, best, won, prev, anim, newBest;
  var L = { x: 0, y: 0, cell: 80, gap: 8, size: 400 };

  function saveKey() { return '2048.save.' + N; }
  function bestKey() { return '2048.best.' + N; }

  function save() {
    MSX.store.set(saveKey(), { grid: grid, score: score, won: won, prev: prev });
  }

  function emptyCells() {
    var out = [];
    for (var i = 0; i < grid.length; i++) { if (!grid[i]) { out.push(i); } }
    return out;
  }

  function spawn() {
    var e = emptyCells();
    if (!e.length) { return -1; }
    var idx = MSX.pick(e);
    grid[idx] = Math.random() < 0.9 ? 2 : 4;
    return idx;
  }

  function canMove() {
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var v = grid[r * N + c];
        if (!v) { return true; }
        if (c + 1 < N && grid[r * N + c + 1] === v) { return true; }
        if (r + 1 < N && grid[(r + 1) * N + c] === v) { return true; }
      }
    }
    return false;
  }

  function lineCells(dir, li) {
    var out = [];
    for (var k = 0; k < N; k++) {
      var r, c;
      if (dir === 'left') { r = li; c = k; }
      else if (dir === 'right') { r = li; c = N - 1 - k; }
      else if (dir === 'up') { r = k; c = li; }
      else { r = N - 1 - k; c = li; }
      out.push(r * N + c);
    }
    return out;
  }

  function move(dir) {
    if (anim) { anim = null; }
    var next = [];
    for (var i = 0; i < N * N; i++) { next.push(0); }
    var slides = [];
    var pops = [];
    var gained = 0;
    var moved = false;

    for (var li = 0; li < N; li++) {
      var cells = lineCells(dir, li);
      var res = [];
      var canMerge = false;
      for (var k = 0; k < N; k++) {
        var from = cells[k];
        var v = grid[from];
        if (!v) { continue; }
        var to;
        if (canMerge && res[res.length - 1] === v) {
          res[res.length - 1] = v * 2;
          gained += v * 2;
          canMerge = false;
          to = cells[res.length - 1];
          pops.push(to);
          moved = true;
        } else {
          res.push(v);
          canMerge = true;
          to = cells[res.length - 1];
        }
        if (from !== to) { moved = true; }
        slides.push({ v: v, from: from, to: to });
      }
      for (var j = 0; j < res.length; j++) { next[cells[j]] = res[j]; }
    }
    if (!moved) { return; }

    prev = { grid: grid.slice(), score: score };
    grid = next;
    score += gained;
    var spawned = spawn();
    anim = { t: 0, slides: slides, pops: pops, spawn: spawned };
    updateHud();
    save();

    if (!won && max() >= 2048) {
      won = true;
      save();
      G.overlay({
        title: 'Вы собрали 2048!',
        text: 'Можно продолжить и попробовать собрать ещё больше.',
        items: [
          { label: 'Продолжить игру', run: function () { G.closeOverlay(); } },
          { label: 'Завершить партию', run: function () { gameOver('Победа!'); } }
        ],
        back: function () { G.closeOverlay(); }
      });
      return;
    }
    if (!canMove()) { gameOver('Ходов больше нет'); }
  }

  function max() {
    var m = 0;
    for (var i = 0; i < grid.length; i++) { if (grid[i] > m) { m = grid[i]; } }
    return m;
  }

  function undo() {
    if (!prev) { G.toast('Отменять нечего'); return; }
    grid = prev.grid;
    score = prev.score;
    prev = null;
    anim = null;
    updateHud();
    save();
    G.invalidate();
  }

  function updateHud() {
    if (score > best) {
      best = score;
      newBest = true;
      MSX.store.set(bestKey(), best);
    }
    G.hud('score', MSX.fmtNum(score));
    G.hud('best', MSX.fmtNum(best));
    G.hud('max', max());
  }

  function gameOver(title) {
    MSX.store.del(saveKey());
    anim = null;
    G.finish({
      title: title,
      stats: [
        ['Счёт', MSX.fmtNum(score), newBest],
        ['Лучшая плитка', max()],
        ['Рекорд (' + N + '×' + N + ')', MSX.fmtNum(best)]
      ]
    });
  }

  /* ---------------- отрисовка ---------------- */

  function resize(w, h) {
    var size = Math.floor(Math.min(w, h));
    L.gap = Math.max(4, Math.round(size * 0.022));
    L.cell = (size - L.gap * (N + 1)) / N;
    L.size = size;
    L.x = Math.round((w - size) / 2);
    L.y = Math.round((h - size) / 2);
  }

  function cellPos(idx) {
    var r = Math.floor(idx / N), c = idx % N;
    return { x: L.x + L.gap + c * (L.cell + L.gap), y: L.y + L.gap + r * (L.cell + L.gap) };
  }

  function drawTile(ctx, x, y, v, scale) {
    var s = L.cell * scale;
    var ox = x + (L.cell - s) / 2;
    var oy = y + (L.cell - s) / 2;
    var col = TILE[v] || ['#f0abfc', '#2a0320'];
    if (v >= 2048) {
      ctx.save();
      ctx.shadowColor = col[0];
      ctx.shadowBlur = L.cell * 0.35;
    }
    ctx.fillStyle = col[0];
    MSX.rrect(ctx, ox, oy, s, s, s * 0.12);
    ctx.fill();
    if (v >= 2048) { ctx.restore(); }
    var digits = String(v).length;
    var fs = s * (digits <= 2 ? 0.46 : digits === 3 ? 0.38 : digits === 4 ? 0.3 : 0.24);
    ctx.fillStyle = col[1];
    ctx.font = '700 ' + Math.round(fs) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(v), ox + s / 2, oy + s / 2 + fs * 0.05);
  }

  function ease(t) { return 1 - (1 - t) * (1 - t); }

  function draw() {
    var ctx = view.ctx;
    ctx.clearRect(0, 0, view.w, view.h);
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    MSX.rrect(ctx, L.x, L.y, L.size, L.size, L.gap * 2);
    ctx.fill();
    for (var i = 0; i < N * N; i++) {
      var p = cellPos(i);
      ctx.fillStyle = 'rgba(255,255,255,.045)';
      MSX.rrect(ctx, p.x, p.y, L.cell, L.cell, L.cell * 0.12);
      ctx.fill();
    }

    if (anim && anim.t < SLIDE) {
      var k = ease(anim.t / SLIDE);
      for (var s = 0; s < anim.slides.length; s++) {
        var sl = anim.slides[s];
        var a = cellPos(sl.from), b = cellPos(sl.to);
        drawTile(ctx, a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, sl.v, 1);
      }
      return;
    }

    var pt = anim ? Math.min(1, (anim.t - SLIDE) / POP) : 1;
    for (var j = 0; j < N * N; j++) {
      if (!grid[j]) { continue; }
      var scale = 1;
      if (anim) {
        if (j === anim.spawn) { scale = ease(pt); }
        else if (anim.pops.indexOf(j) !== -1) { scale = 1 + 0.16 * Math.sin(Math.PI * pt); }
      }
      if (scale <= 0.01) { continue; }
      var q = cellPos(j);
      drawTile(ctx, q.x, q.y, grid[j], scale);
    }
  }

  /* ---------------- движок ---------------- */

  function begin(s) {
    N = s.size;
    view = G.canvas();
    resize(view.w, view.h);
    best = MSX.store.get(bestKey(), 0);
    newBest = false;
    anim = null;
    updateHud();
  }

  G = MSX.game({
    id: '2048',
    title: '2048',
    options: [
      { key: 'size', label: 'Размер поля', values: [{ value: 4, label: '4 × 4' }, { value: 5, label: '5 × 5' }, { value: 6, label: '6 × 6' }], def: 4 }
    ],
    hud: [
      { key: 'score', label: 'Счёт' },
      { key: 'max', label: 'Плитка' },
      { key: 'best', label: 'Рекорд' }
    ],
    hints: [['◀ ▲ ▼ ▶', 'сдвиг плиток'], ['0', 'отменить ход'], ['OK / BACK', 'пауза']],
    info: function (s) {
      var b = MSX.store.get('2048.best.' + s.size, 0);
      return b ? 'Рекорд ' + s.size + '×' + s.size + ': ' + MSX.fmtNum(b) : 'Складывайте одинаковые плитки';
    },
    canContinue: function (s) { return !!MSX.store.get('2048.save.' + s.size, null); },
    start: function (s) {
      grid = [];
      for (var i = 0; i < s.size * s.size; i++) { grid.push(0); }
      N = s.size;
      score = 0;
      won = false;
      prev = null;
      spawn();
      spawn();
      begin(s);
      save();
    },
    resume: function (s) {
      var d = MSX.store.get('2048.save.' + s.size, null);
      grid = d.grid;
      score = d.score;
      won = d.won;
      prev = d.prev || null;
      begin(s);
      if (!canMove()) { gameOver('Ходов больше нет'); }
    },
    pauseItems: function () { return [{ label: 'Отменить ход', run: function () { undo(); G.closeOverlay(); } }]; },
    resize: resize,
    update: function (dt) {
      if (!anim) { return; }
      anim.t += dt;
      if (anim.t >= SLIDE + POP) { anim = null; }
      G.invalidate();
    },
    draw: draw,
    key: function (k, rep) {
      // автоповтор при удержании стрелки игнорируем: в 2048 он даёт случайные лишние ходы
      if (k === 'left' || k === 'right' || k === 'up' || k === 'down') { if (!rep) { move(k); } return true; }
      if (k === '0' && !rep) { undo(); return true; }
      if (k === 'ok' && !rep) { G.pause(); return true; }
      return k !== 'back';
    }
  });
})();
</script>
</body>
</html>
