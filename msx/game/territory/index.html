<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Территория — MSX</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070a0f;
    --line:rgba(255,255,255,.08);
    --text:rgba(255,255,255,.94);
    --muted:rgba(255,255,255,.5);
    --accent:#4c8dff;
  }
  *{box-sizing:border-box;}
  html{font-size:clamp(15px,1.05vw,24px);}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 0%,rgba(76,141,255,.16),transparent 70%),
      radial-gradient(50% 45% at 85% 100%,rgba(140,69,247,.12),transparent 70%);
  }
  #app{position:relative;height:100%;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;padding:2.2rem 2.6rem;}
  .screen.active{display:flex;}
  .brand{text-align:center;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);}
  .menu-head{margin-top:4vh;text-align:center;}
  .menu-head h1{margin:.3rem 0 0;font-size:3.2rem;font-weight:650;letter-spacing:-.02em;}
  .menu-head .sub{margin:.5rem 0 0;color:var(--muted);font-size:1.05rem;}
  .menu-list{display:flex;flex-direction:column;gap:.7rem;width:min(36rem,100%);margin:2.4rem auto 0;}
  .menu-item{
    display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;border-radius:1rem;
    border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:1.05rem;
    transition:transform .12s ease,background .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .menu-item .name{font-weight:550;}
  .menu-item .meta{margin-left:auto;color:var(--muted);font-size:.9rem;}
  .menu-item.sel{
    background:rgba(76,141,255,.16);border-color:rgba(76,141,255,.65);transform:scale(1.03);
    box-shadow:0 0 0 2px rgba(76,141,255,.35),0 20px 44px -20px rgba(76,141,255,.85);
  }
  .hud{display:flex;gap:1.2rem;justify-content:center;}
  .hud-item{
    display:flex;flex-direction:column;align-items:center;min-width:8.5rem;padding:.5rem 1.2rem;
    border:1px solid var(--line);border-radius:.9rem;background:rgba(255,255,255,.03);
  }
  .hud-label{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .hud b{font-size:1.5rem;font-variant-numeric:tabular-nums;}
  .board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:1.2rem 0;}
  .board-wrap canvas{
    display:block;width:100%;height:100%;border-radius:1rem;border:1px solid var(--line);background:#0a1016;
  }
  .hint-bar{display:flex;flex-wrap:wrap;gap:.5rem 1.6rem;justify-content:center;color:var(--muted);font-size:.85rem;}
  .hint-bar span{display:inline-flex;align-items:center;gap:.45rem;}
  .kbd{
    border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:.45rem;
    padding:.1rem .5rem;color:rgba(255,255,255,.85);font-size:.8rem;
  }
  .overlay{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(4,7,11,.75);opacity:0;pointer-events:none;transition:opacity .15s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .panel{
    width:min(34rem,86vw);padding:2rem;border-radius:1.4rem;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(20,28,39,.98),rgba(12,17,24,.98));
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
  }
  .panel h2{margin:0 0 .35rem;font-size:1.9rem;font-weight:650;}
  .ov-text{margin:0 0 1.5rem;color:var(--muted);font-size:.98rem;}
  .panel .menu-list{margin:0;width:100%;}
</style>
</head>
<body>
<div id="app">
  <section id="screen-menu" class="screen active">
    <div class="brand">MSX Games</div>
    <div class="menu-head">
      <h1>Территория</h1>
      <p class="sub">Вернулся в свою землю — забрал всю выделенную область. В свой след врезаться нельзя, а если соперник перережет твой — начинаешь заново</p>
    </div>
    <nav id="menuList" class="menu-list"></nav>
    <div style="flex:1"></div>
    <div class="hint-bar">
      <span><b class="kbd">▲ ▼</b> выбор</span>
      <span><b class="kbd">OK</b> играть</span>
      <span><b class="kbd">BACK</b> выход</span>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <div class="hud">
      <div class="hud-item"><span class="hud-label">Владение</span><b id="hudLand">0%</b></div>
      <div class="hud-item"><span class="hud-label">Соперники</span><b id="hudBots">0</b></div>
      <div class="hud-item"><span class="hud-label">Захвачено</span><b id="hudScore">0</b></div>
    </div>
    <div id="boardWrap" class="board-wrap"><canvas id="scene"></canvas></div>
    <div class="hint-bar">
      <span><b class="kbd">◀ ▲ ▼ ▶</b> движение</span>
      <span><b class="kbd">OK</b> пауза</span>
      <span><b class="kbd">BACK</b> пауза</span>
    </div>
  </section>
</div>

<div id="overlay" class="overlay">
  <div class="panel">
    <h2 id="ovTitle"></h2>
    <p id="ovText" class="ov-text"></p>
    <nav id="ovList" class="menu-list"></nav>
  </div>
</div>

<script>
(function () {
  var LEVELS = [{ name: 'Обычно', bots: 5 }];
  var OK_CODES = [13, 32];
  var BACK_CODES = [8, 27, 166, 461, 10009];

  var GRID_W = 112;
  var GRID_H = 76;
  var CELL = 30;
  var WORLD_H = 500;
  var PLAYER_SPEED = 7.6;
  var WIN_SHARE = 0.9;
  var COLORS = ['#4c8dff', '#f87171', '#34d399', '#fbbf24', '#c084fc', '#22d3ee', '#fb923c', '#a3e635', '#f472b6'];

  function isOk(k) { return OK_CODES.indexOf(k) !== -1; }
  function isBack(k) { return BACK_CODES.indexOf(k) !== -1; }

  var screenMenu = document.getElementById('screen-menu');
  var screenGame = document.getElementById('screen-game');
  var menuList = document.getElementById('menuList');
  var boardWrap = document.getElementById('boardWrap');
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var hudLand = document.getElementById('hudLand');
  var hudBots = document.getElementById('hudBots');
  var hudScore = document.getElementById('hudScore');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovList = document.getElementById('ovList');

  var screen = 'menu';
  var state = 'menu';
  var levelIndex = 0;
  var menuIndex = 0;
  var MENU_LEN = 2;

  var k = 1;
  var viewW = 900;
  var viewCellsX = 32;
  var viewCellsY = WORLD_H / CELL;
  var camX = 0;
  var camY = 0;

  var owner = null;
  var trailAt = null;
  var entities = [];
  var player = null;
  var landGained = 0;
  var shareCache = 0;
  var minimap = null;
  var miniCtx = null;
  var miniData = null;
  var miniTimer = 0;
  var flashText = '';
  var flashTimer = 0;

  var rafId = null;
  var lastTime = 0;
  var overlayOpen = false;
  var ovItems = [];
  var ovIndex = 0;
  var resultReason = '';
  var held = {};

  function nowMs() {
    return (window.performance && window.performance.now) ? window.performance.now() : Date.now();
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function idx(x, y) { return y * GRID_W + x; }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < GRID_W && y < GRID_H; }
  function cfg() { return LEVELS[levelIndex]; }

  function buildMenuItem(label, meta) {
    var item = document.createElement('div');
    item.className = 'menu-item';
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = label;
    item.appendChild(name);
    if (meta) {
      var m = document.createElement('span');
      m.className = 'meta';
      m.textContent = meta;
      item.appendChild(m);
    }
    return item;
  }

  function buildMenu() {
    menuList.innerHTML = '';
    menuList.appendChild(buildMenuItem('Играть', null));
    menuList.appendChild(buildMenuItem('Выход', null));
    selectMenu(menuIndex);
  }

  function selectMenu(i) {
    for (var n = 0; n < menuList.children.length; n++) {
      menuList.children[n].classList.toggle('sel', n === i);
    }
  }

  function setScreen(name) {
    screen = name;
    screenMenu.classList.toggle('active', name === 'menu');
    screenGame.classList.toggle('active', name === 'game');
  }

  function landShare(id) {
    var total = GRID_W * GRID_H;
    var count = 0;
    for (var i = 0; i < total; i++) { if (owner[i] === id) { count++; } }
    return count / total;
  }

  function updateHud() {
    hudScore.textContent = landGained;
    if (!owner) {
      hudLand.textContent = '0%';
      hudBots.textContent = '0';
      return;
    }
    shareCache = landShare(1);
    hudLand.textContent = Math.round(shareCache * 100) + '%';
    var alive = 0;
    for (var i = 1; i < entities.length; i++) { if (entities[i].alive) { alive++; } }
    hudBots.textContent = alive;
  }

  function resize() {
    var rect = boardWrap.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    k = canvas.height / WORLD_H;
    viewW = canvas.width / k;
    viewCellsX = viewW / CELL;
    viewCellsY = WORLD_H / CELL;
  }

  function makeEntity(id, tileX, tileY, speed, isPlayer) {
    return {
      id: id,
      tileX: tileX,
      tileY: tileY,
      x: tileX + 0.5,
      y: tileY + 0.5,
      dx: 0,
      dy: 0,
      speed: speed,
      trail: [],
      returnAt: isPlayer ? 0 : Math.floor(rand(12, 19)),
      alive: true,
      think: rand(0.05, 0.15),
      isPlayer: !!isPlayer,
      color: COLORS[id % COLORS.length]
    };
  }

  function paintPatch(e) {
    for (var dx = -1; dx <= 1; dx++) {
      for (var dy = -1; dy <= 1; dy++) {
        var x = e.tileX + dx, y = e.tileY + dy;
        if (inBounds(x, y)) { owner[idx(x, y)] = e.id; }
      }
    }
  }

  function startLevel(li) {
    levelIndex = li;
    stopLoop();
    closeOverlay();
    setScreen('game');
    resize();

    owner = new Uint8Array(GRID_W * GRID_H);
    trailAt = new Uint8Array(GRID_W * GRID_H);
    entities = [];

    player = makeEntity(1, Math.floor(GRID_W / 2), Math.floor(GRID_H / 2), PLAYER_SPEED, true);
    player.dx = 1;
    player.dy = 0;
    entities.push(player);
    paintPatch(player);

    var bots = cfg().bots;
    for (var b = 0; b < bots; b++) {
      var ang = (b / bots) * Math.PI * 2;
      var bx = Math.round(GRID_W / 2 + Math.cos(ang) * GRID_W * 0.33);
      var by = Math.round(GRID_H / 2 + Math.sin(ang) * GRID_H * 0.34);
      bx = Math.max(4, Math.min(GRID_W - 5, bx));
      by = Math.max(4, Math.min(GRID_H - 5, by));
      var bot = makeEntity(b + 2, bx, by, rand(5.5, 7.0), false);
      bot.dx = bx < GRID_W / 2 ? 1 : -1;
      bot.dy = 0;
      entities.push(bot);
      paintPatch(bot);
    }

    camX = player.x - viewCellsX / 2;
    camY = player.y - viewCellsY / 2;
    landGained = 0;
    flashText = '';
    flashTimer = 0;
    miniTimer = 0;

    if (!minimap) {
      minimap = document.createElement('canvas');
      minimap.width = GRID_W;
      minimap.height = GRID_H;
      miniCtx = minimap.getContext('2d');
      miniData = miniCtx.createImageData(GRID_W, GRID_H);
    }

    updateHud();
    updateMinimap();
    state = 'playing';
    draw();
    startLoop();
  }

  function clearTrail(e) {
    for (var i = 0; i < e.trail.length; i++) { trailAt[e.trail[i]] = 0; }
    e.trail = [];
  }

  function transfer(fromId, toId) {
    var total = GRID_W * GRID_H;
    for (var i = 0; i < total; i++) {
      if (owner[i] === fromId) { owner[i] = toId; }
    }
  }

  function floodClaim(e) {
    var total = GRID_W * GRID_H;
    var blocked = new Uint8Array(total);
    var seen = new Uint8Array(total);
    var i;
    for (i = 0; i < e.trail.length; i++) { blocked[e.trail[i]] = 1; }
    for (i = 0; i < total; i++) { if (owner[i] === e.id) { blocked[i] = 1; } }

    var stack = [];
    var x, y;
    for (x = 0; x < GRID_W; x++) {
      if (!blocked[idx(x, 0)]) { stack.push(idx(x, 0)); }
      if (!blocked[idx(x, GRID_H - 1)]) { stack.push(idx(x, GRID_H - 1)); }
    }
    for (y = 0; y < GRID_H; y++) {
      if (!blocked[idx(0, y)]) { stack.push(idx(0, y)); }
      if (!blocked[idx(GRID_W - 1, y)]) { stack.push(idx(GRID_W - 1, y)); }
    }

    while (stack.length) {
      i = stack.pop();
      if (seen[i]) { continue; }
      seen[i] = 1;
      x = i % GRID_W;
      y = (i - x) / GRID_W;
      if (x > 0 && !blocked[i - 1] && !seen[i - 1]) { stack.push(i - 1); }
      if (x < GRID_W - 1 && !blocked[i + 1] && !seen[i + 1]) { stack.push(i + 1); }
      if (y > 0 && !blocked[i - GRID_W] && !seen[i - GRID_W]) { stack.push(i - GRID_W); }
      if (y < GRID_H - 1 && !blocked[i + GRID_W] && !seen[i + GRID_W]) { stack.push(i + GRID_W); }
    }

    var gained = 0;
    for (i = 0; i < total; i++) {
      if (!blocked[i] && !seen[i] && owner[i] !== e.id) { owner[i] = e.id; gained++; }
    }
    for (i = 0; i < e.trail.length; i++) {
      if (owner[e.trail[i]] !== e.id) { owner[e.trail[i]] = e.id; gained++; }
      trailAt[e.trail[i]] = 0;
    }
    e.trail = [];
    return gained;
  }

  function kill(victim, killer, reason) {
    if (!victim || !victim.alive) { return; }
    victim.alive = false;
    clearTrail(victim);
    if (killer && killer !== victim) {
      transfer(victim.id, killer.id);
      if (killer.isPlayer) {
        landGained += 100;
        flashText = 'Захват!';
        flashTimer = 1;
      }
    } else if (!victim.isPlayer) {
      transfer(victim.id, 0);
    }

    if (victim.isPlayer) {
      stopLoop();
      state = 'dead';
      resultReason = reason || (killer === victim ? 'Вы перерезали свой собственный след.' : 'Соперник перерезал ваш след.');
      draw();
      showOverlay('lose', resultReason);
      return;
    }

    var alive = 0;
    for (var i = 1; i < entities.length; i++) { if (entities[i].alive) { alive++; } }
    updateHud();
    if (alive === 0) {
      stopLoop();
      state = 'won';
      draw();
      showOverlay('win');
    }
  }

  function enterCell(e) {
    var gx = Math.floor(e.x);
    var gy = Math.floor(e.y);
    if (!inBounds(gx, gy)) {
      kill(e, e, 'Вы врезались в границу карты.');
      return;
    }
    if (gx === e.tileX && gy === e.tileY) { return; }

    var i = idx(gx, gy);
    var t = trailAt[i];
    if (t === e.id) {
      kill(e, e, 'Вы врезались в собственный след.');
      return;
    }
    if (t !== 0) {
      var other = entities[t - 1];
      if (other && other.alive) { kill(other, e); }
    }

    e.tileX = gx;
    e.tileY = gy;

    if (owner[i] === e.id) {
      if (e.trail.length) {
        var gained = floodClaim(e);
        if (e.isPlayer && gained > 0) {
          landGained += gained;
          flashText = '+' + gained;
          flashTimer = 0.8;
          updateHud();
          if (landShare(1) > WIN_SHARE) {
            stopLoop();
            state = 'won';
            draw();
            showOverlay('win');
            return;
          }
        }
      }
    } else if (t !== e.id) {
      e.trail.push(i);
      trailAt[i] = e.id;
    }
  }

  function nearestOwnedDistance(id, x, y, maxRadius) {
    for (var radius = 0; radius <= maxRadius; radius++) {
      for (var dx = -radius; dx <= radius; dx++) {
        var dy = radius - Math.abs(dx);
        var nx = x + dx;
        var ny = y + dy;
        if (inBounds(nx, ny) && owner[idx(nx, ny)] === id) { return radius; }
        if (dy > 0 && inBounds(nx, y - dy) && owner[idx(nx, y - dy)] === id) { return radius; }
      }
    }
    return maxRadius + 1;
  }

  function thinkBot(e, dt) {
    e.think -= dt;
    if (e.think > 0) { return; }
    e.think = rand(0.08, 0.18);

    var dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
    var best = null;
    var bestScore = -1e9;
    var returning = e.trail.length >= e.returnAt;
    var currentHome = returning ? nearestOwnedDistance(e.id, e.tileX, e.tileY, 20) : 0;

    for (var d = 0; d < dirs.length; d++) {
      var dir = dirs[d];
      if (dir.x === -e.dx && dir.y === -e.dy) { continue; }
      var score = 0;
      for (var s = 1; s <= 12; s++) {
        var nx = e.tileX + dir.x * s;
        var ny = e.tileY + dir.y * s;
        if (!inBounds(nx, ny)) { score -= 260 + (12 - s) * 15; break; }
        var ii = idx(nx, ny);
        if (trailAt[ii] === e.id) { score -= 280; break; }
        if (trailAt[ii] !== 0) {
          score += 165 / s;
          break;
        }
        if (owner[ii] === e.id) {
          score -= s === 1 ? 5 : 1.5;
          if (e.trail.length) { score += s === 1 ? 72 : 24 / s; }
        } else {
          score += (owner[ii] === 0 ? 5 : 2) / (1 + s * 0.08);
        }
      }
      if (returning) {
        var homeDistance = nearestOwnedDistance(e.id, e.tileX + dir.x, e.tileY + dir.y, 20);
        score += (currentHome - homeDistance) * 24 - homeDistance * 0.8;
        if (owner[idx(e.tileX + dir.x, e.tileY + dir.y)] === e.id) { score += 120; }
      }
      if (dir.x === e.dx && dir.y === e.dy) { score += 3; }
      score += Math.random() * 1.5;
      if (score > bestScore) { bestScore = score; best = dir; }
    }
    if (best) { e.dx = best.x; e.dy = best.y; }
  }

  function update(dt) {
    if (state !== 'playing') { return; }
    for (var i = 0; i < entities.length; i++) {
      var e = entities[i];
      if (!e.alive) { continue; }
      if (!e.isPlayer) { thinkBot(e, dt); }
      e.x += e.dx * e.speed * dt;
      e.y += e.dy * e.speed * dt;
      enterCell(e);
      if (state !== 'playing') { return; }
    }

    var targetX = player.x - viewCellsX / 2;
    var targetY = player.y - viewCellsY / 2;
    camX += (targetX - camX) * Math.min(1, dt * 8);
    camY += (targetY - camY) * Math.min(1, dt * 8);
    camX = Math.max(0, Math.min(GRID_W - viewCellsX, camX));
    camY = Math.max(0, Math.min(GRID_H - viewCellsY, camY));
    if (GRID_W < viewCellsX) { camX = (GRID_W - viewCellsX) / 2; }
    if (GRID_H < viewCellsY) { camY = (GRID_H - viewCellsY) / 2; }

    if (flashTimer > 0) { flashTimer -= dt; }
    miniTimer -= dt;
    if (miniTimer <= 0) { miniTimer = 0.25; updateMinimap(); updateHud(); }
  }

  function colorFor(id) {
    if (id === 0) { return 'rgba(255,255,255,.03)'; }
    return COLORS[id % COLORS.length];
  }

  function updateMinimap() {
    if (!miniData) { return; }
    var data = miniData.data;
    for (var i = 0; i < GRID_W * GRID_H; i++) {
      var o = owner[i];
      var t = trailAt[i];
      var r, g, b;
      if (t !== 0) {
        r = 255; g = 255; b = 255;
      } else if (o === 0) {
        r = 18; g = 24; b = 32;
      } else {
        var hex = COLORS[o % COLORS.length];
        r = parseInt(hex.slice(1, 3), 16);
        g = parseInt(hex.slice(3, 5), 16);
        b = parseInt(hex.slice(5, 7), 16);
      }
      var p = i * 4;
      data[p] = r;
      data[p + 1] = g;
      data[p + 2] = b;
      data[p + 3] = 255;
    }
    miniCtx.putImageData(miniData, 0, 0);
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!owner || !player) { return; }
    ctx.setTransform(k, 0, 0, k, 0, 0);

    ctx.fillStyle = '#080d12';
    ctx.fillRect(0, 0, viewW, WORLD_H);

    var x0 = Math.max(0, Math.floor(camX) - 1);
    var y0 = Math.max(0, Math.floor(camY) - 1);
    var x1 = Math.min(GRID_W - 1, Math.ceil(camX + viewCellsX) + 1);
    var y1 = Math.min(GRID_H - 1, Math.ceil(camY + viewCellsY) + 1);
    var cell = CELL;

    var gx, gy, i, px, py;
    ctx.globalAlpha = 0.34;
    for (gy = y0; gy <= y1; gy++) {
      for (gx = x0; gx <= x1; gx++) {
        i = idx(gx, gy);
        if (owner[i] === 0) { continue; }
        ctx.fillStyle = colorFor(owner[i]);
        px = (gx - camX) * cell;
        py = (gy - camY) * cell;
        ctx.fillRect(px, py, cell + 0.6, cell + 0.6);
      }
    }
    ctx.globalAlpha = 1;

    for (gy = y0; gy <= y1; gy++) {
      for (gx = x0; gx <= x1; gx++) {
        i = idx(gx, gy);
        if (trailAt[i] === 0) { continue; }
        ctx.fillStyle = COLORS[trailAt[i] % COLORS.length];
        px = (gx - camX) * cell;
        py = (gy - camY) * cell;
        ctx.fillRect(px + 3, py + 3, cell - 6, cell - 6);
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 3;
    ctx.strokeRect(-camX * cell, -camY * cell, GRID_W * cell, GRID_H * cell);

    for (i = 0; i < entities.length; i++) {
      var e = entities[i];
      if (!e.alive) { continue; }
      px = (e.x - camX) * cell;
      py = (e.y - camY) * cell;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(px, py, cell * (e.isPlayer ? 0.62 : 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.arc(px + e.dx * cell * 0.3, py + e.dy * cell * 0.3, cell * 0.18, 0, Math.PI * 2);
      ctx.fill();
      if (e.isPlayer) {
        ctx.strokeStyle = 'rgba(255,255,255,.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(px, py, cell * 0.78, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    if (minimap) {
      var mmW = 150;
      var mmH = mmW * GRID_H / GRID_W;
      ctx.globalAlpha = 0.92;
      ctx.drawImage(minimap, viewW - mmW - 14, 14, mmW, mmH);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,255,255,.2)';
      ctx.lineWidth = 2;
      ctx.strokeRect(viewW - mmW - 14, 14, mmW, mmH);
    }

    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = '17px sans-serif';
    ctx.fillText('ваша земля: ' + Math.round(shareCache * 100) + '%  ·  цель ' + Math.round(WIN_SHARE * 100) + '%', 18, WORLD_H - 16);

    if (flashTimer > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, flashTimer) + ')';
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(flashText, viewW / 2, 70);
      ctx.textAlign = 'left';
    }
  }

  function frame(ts) {
    if (state !== 'playing') { return; }
    var now = (typeof ts === 'number') ? ts : nowMs();
    var dt = (now - lastTime) / 1000;
    if (!isFinite(dt) || dt < 0) { dt = 0; }
    if (dt > 0.05) { dt = 0.05; }
    lastTime = now;
    update(dt);
    draw();
    rafId = window.requestAnimationFrame(frame);
  }

  function startLoop() {
    stopLoop();
    lastTime = nowMs();
    rafId = window.requestAnimationFrame(frame);
  }

  function stopLoop() {
    if (rafId !== null) {
      window.cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function buildOverlayList(items) {
    ovList.innerHTML = '';
    for (var i = 0; i < items.length; i++) {
      ovList.appendChild(buildMenuItem(items[i].label, null));
    }
    selectOverlay(ovIndex);
  }

  function selectOverlay(i) {
    for (var n = 0; n < ovList.children.length; n++) {
      ovList.children[n].classList.toggle('sel', n === i);
    }
  }

  function showOverlay(type, reason) {
    var title = 'Пауза';
    var text = 'Игра приостановлена.';
    var items = [
      { label: 'Продолжить', run: resume },
      { label: 'Новая игра', run: function () { startLevel(levelIndex); } },
      { label: 'Выход', run: exitApp }
    ];
    if (type === 'lose') {
      title = 'Вас перерезали';
      text = (reason || '') + ' Земля: ' + Math.round(landShare(1) * 100) + '%.';
      items = [
        { label: 'Новая игра', run: function () { startLevel(levelIndex); } },
        { label: 'Выход', run: exitApp }
      ];
    } else if (type === 'win') {
      title = 'Победа';
      text = 'Вы забрали ' + Math.round(landShare(1) * 100) + '% карты. Захвачено зон: ' + landGained + '.';
      items = [
        { label: 'Новая игра', run: function () { startLevel(levelIndex); } },
        { label: 'Выход', run: exitApp }
      ];
    }
    overlayOpen = true;
    ovIndex = 0;
    ovItems = items;
    ovTitle.textContent = title;
    ovText.textContent = text;
    buildOverlayList(items);
    overlay.classList.add('show');
  }

  function closeOverlay() {
    overlayOpen = false;
    overlay.classList.remove('show');
  }

  function resume() {
    closeOverlay();
    if (state === 'playing') { startLoop(); }
  }

  function activateMenu() {
    if (menuIndex === 0) { startLevel(0); }
    else { exitApp(); }
  }

  function exitApp() {
    location.href = '../index.html';
  }

  function moveOverlay(d) {
    var n = ovItems.length;
    if (!n) { return; }
    ovIndex = (ovIndex + d + n) % n;
    selectOverlay(ovIndex);
  }

  function activateOverlay() {
    var item = ovItems[ovIndex];
    if (item) { item.run(); }
  }

  function onKeyDown(e) {
    var key = e.keyCode || e.which;
    if ((key >= 37 && key <= 40) || isOk(key) || isBack(key)) { e.preventDefault(); }
    if (e.repeat && isOk(key)) { return; }

    if (overlayOpen) {
      if (key === 38) { moveOverlay(-1); }
      else if (key === 40) { moveOverlay(1); }
      else if (isOk(key)) { activateOverlay(); }
      else if (isBack(key)) { resume(); }
      return;
    }

    if (screen === 'menu') {
      if (key === 38) { menuIndex = (menuIndex + MENU_LEN - 1) % MENU_LEN; selectMenu(menuIndex); }
      else if (key === 40) { menuIndex = (menuIndex + 1) % MENU_LEN; selectMenu(menuIndex); }
      else if (isOk(key)) { activateMenu(); }
      else if (isBack(key)) { exitApp(); }
      return;
    }

    if (state !== 'playing') {
      if (isOk(key) || isBack(key)) { showOverlay(state === 'won' ? 'win' : 'lose', resultReason); }
      return;
    }

    if (key === 37 && player.dx !== 1) { player.dx = -1; player.dy = 0; }
    else if (key === 39 && player.dx !== -1) { player.dx = 1; player.dy = 0; }
    else if (key === 38 && player.dy !== 1) { player.dx = 0; player.dy = -1; }
    else if (key === 40 && player.dy !== -1) { player.dx = 0; player.dy = 1; }
    else if (isOk(key) || isBack(key)) { stopLoop(); showOverlay('pause'); }
  }

  document.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', function () { resize(); draw(); });
  window.addEventListener('blur', function () { if (state === 'playing') { stopLoop(); } });

  buildMenu();
  updateHud();
})();
</script>
</body>
</html>
